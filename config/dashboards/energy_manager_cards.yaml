- type: custom:apexcharts-card
  graph_span: 12h
  update_interval: 5min
  header:
    show: true
    title: Inverter Power - Last 12 Hours
    show_states: true
    colorize_states: true
    standard_format: false
  yaxis:
  - id: power
    decimals: 2
    apex_config:
      title:
        text: Power (W)
      labels:
        formatter: |
          EVAL:function(value) {
            if (value >= 1000) {
              return (value / 1000).toFixed(1) + 'kW';
            }
            return value.toFixed(0) + 'W';
          }
  - id: percentage
    opposite: true
    decimals: 1
    max: 100
    min: 0
    apex_config:
      title:
        text: Battery Level (%)
  series:
  - entity: sensor.inverter_pv_power
    name: PV Power
    type: area
    color: '#FFD700'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_load_power
    name: Load Power
    type: area
    color: '#87CEEB'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_import_power
    name: Grid Import
    type: area
    color: '#FF6B6B'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_export_power
    name: Grid Export
    type: area
    color: '#90EE90'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_battery_charging_power
    name: Battery Charging
    type: area
    color: '#FFA500'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_battery_discharging_power
    name: Battery Discharging
    type: area
    color: '#DDA0DD'
    opacity: 0.3
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: power
  - entity: sensor.inverter_battery_level
    name: Battery Level
    type: line
    color: '#32CD32'
    stroke_width: 1
    group_by:
      func: avg
      duration: 5min
    yaxis_id: percentage
  apex_config:
    chart:
      height: 250
      animations:
        enabled: true
    stroke:
      curve: smooth
      dashArray:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 5
    dataLabels:
      enabled: false
    legend:
      show: true
      position: bottom
    tooltip:
      enabled: true
      shared: true
      x:
        format: HH:mm dd/MM
      'y':
        formatter: |
          EVAL:function(value, { seriesIndex }) {
            if (seriesIndex === 6) {
              return value.toFixed(1) + '%';
            }
            if (value >= 1000) {
              return (value / 1000).toFixed(2) + ' kW';
            }
            return value.toFixed(0) + ' W';
          }
    grid:
      show: true
      strokeDashArray: 3
    xaxis:
      type: datetime
      labels:
        format: HH:mm
  card_mod:
    style: |
      #header {
        padding: 5px 10px 0 !important;
      }

      #header__title {
        font-size: 13px !important;
        padding-bottom: 2px !important;
      }

      #header__states {
        margin: -2px !important;
        gap: 2px;
      }

      #header__states > * {
        margin: 2px !important;
      }

      #state__value > #state {
        font-size: 1.3em !important;
      }

      #state__value > #uom {
        font-size: 0.75em !important;
      }

      #state__name {
        font-size: 0.7em !important;
      }
  view_layout:
    em_id: inverter-last-12-hours
    em_width: 12
    em_name: Inverter - Last 12 Hours
    em_column: 1
    em_order: 17
- type: custom:apexcharts-card
  header:
    show: true
    title: Current Power Usage Profile by Hour (W)
  graph_span: 24h
  span:
    start: day
  now:
    show: true
    label: Now
  series:
  - entity: sensor.power_estimate_profile
    name: Predicted Power (W)
    type: column
    data_generator: >
      let data = []; const attributes =
      entity.attributes.attributes; const today = new Date(); if
      (attributes) {
        for (let i = 0; i < 24; i++) {
          let hourKey = 'hour_' + String(i).padStart(2, '0');
          let value = attributes[hourKey];
          if (value !== null && value !== undefined) {
            let timestamp = new Date(today.getFullYear(), today.getMonth(), today.getDate(), i, 0, 0, 0);
            data.push([timestamp.getTime(), parseFloat(value)]);
          }
        }
      } return data;
  view_layout:
    em_id: current-power-profile
    em_width: 12
    em_name: Current Power Profile
    em_column: 1
    em_order: 18
