- type: markdown
  content: >
    {% if is_state('switch.energy_control_on_off', 'on') %}
      <h1 style="color: orange; margin-top: 0;">✅ Energy Manager Decision</h1>
    {% else %}
      <h1 style="color: black; margin-top: 0;">❌ Energy Manager Decision</h1>
      <h2>Energy Control is disabled.</h2>
      <h3>The last update received was:</h3>
    {% endif %}

    {% set file_content = states('sensor.energy_manager_decision') |
    string %}

    {% if file_content | trim == '' or file_content in ['unknown', 'unavailable', 'Unknown'] %}
      <i>The decision will be displayed once you have successfully queried the Energy Manager API.<p>Connectivity will not occur until your
    Amber Electric/LocalVolts pricing is received (if applicable), and your BOM integration is working. You must also have entered your Energy
    Manager API key. Only after this will Energy Manager attempt to connect through to the Energy Manager API servers.</p></i>
    {% else %}
      {% set translated_content = file_content
        .replace('Mode: Self', 'Mode: Self Consumption')
        .replace('Mode: Imp', 'Mode: Import')
        .replace('Mode: Exp', 'Mode: Export')
        .replace('Reason: Self', 'Reason: Ordinary Self Consumption')
        .replace('Reason: export_','Reason: Export period ')
        .replace('Reason: FPFC','Reason: Free period, force charge')
        .replace('Reason: SCT','Reason: Scheduled charge, charge to')
        .replace('Reason: SCH','Reason: Scheduled charge, target reached, hold')
        .replace('Reason: CHGRQD','Reason: Charge required - ')
        .replace('Reason: BATTR','Reason: Battery discharge restricted. Less than ')
        .replace('Reason: FPPB','Reason: Free period, preserve battery')
        .replace('Reason: CAPRFP','Reason: Free import cap reached')
        .replace('Reason: EXPCP','Reason: Export cap reached')
        .replace('Reason: CRTE','Reason: Curtail Export')
        .replace('Reason: FICB','Reason: Free import - charging battery')
        .replace('Batt:', 'Battery SoC:')
        .replace('Exp SOC:', 'Battery reserve:')
        .replace('ESOC:', 'Export SOC:')
        .replace('free_', 'Free Tariff #')
        .replace('peak_', 'Peak Tariff #')
        .replace('offpeak_', 'Offpeak Tariff #')
        .replace('shoulder_', 'Shoulder Tariff #')
        .replace('export_', 'Export Tariff #')
        .replace('Curtail:', 'Curtail Exports:')
        .replace('Chg','Charge')
        .replace('Dchg','Discharge')
        .replace('MD:','Mode:')
        .replace('BY:','Buy band:')
        .replace('SL:','Sell band:')
        .replace('CT:','Curtailment:')
      %}
      {% set translated_content = translated_content
        .replace('CTD:','Curtailment: Disabled (User override)')
        .replace('CRBAMS','Charge Rate: Battery at max SoC')
        .replace('CRNBSTM','Charge Rate: -ve buy, set to max')
        .replace('CRMAR','Charge Rate: Maximum available rate')
        .replace('CRSEBL','Charge Rate: Slow to extend battery life')
        .replace('CRLGMAR','Charge Rate: Low gen, maximum available rate')
        .replace('CRLGSEBL','Charge Rate: Low gen, slow to extend batt life')
        .replace('CRGOS50','Charge Rate: Gen ok, Slow 50%')
        .replace('CRGOLB20','Charge Rate: Gen ok, Low batt, 20% Charge')
        .replace('CRGOBAF10','Charge Rate: Gen ok, batt almost full, 10% Charge')
        .replace('CR:NL','Charge Rate: No limit')
        .replace('M:P','Morning peak')
        .replace('FD:','force discharge')
        .replace('EF:','Extreme FIT')
        .replace('VHF:','Very high FIT')
        .replace('MF:','Moderate FIT')
        .replace('AF:','Acceptable FIT')
        .replace('OK:','Okay FIT')
        .replace('FEN:','Force Export: No')
        .replace('P3FC:','Paid >3c, force charge if possible')
        .replace('P2I:','Paid to import')
        .replace('DFCIP:','detected. Force charge if possible.')
        .replace('1CBLFC:','1pm, cheap, batt low, force charge')
        .replace('LGFC:','low gen, force charge')
        .replace('CGBEFC','Cheap, gen not enough, force charge')
        .replace('DFCDSI','Do not force charge, do not shut inverter')
        .replace('PBGBC','Preserve battery - grid < battery cost')
        .replace('10NDPB','10am, not demand, preserving battery - cheap grid')
        .replace('10NPBUB','10am - not preserving battery, use of battery ok')
        .replace('10IDNPB','10am or in demand, not preserving battery, use of battery ok.')
        .replace('ICFC:','Import, cheap, fast charge')
        .replace('ENSL:','Export: No, sell locked at')
        .replace('PHRR:','Price high 12am>5am, releasing reserve')
        .replace('FCNSIN','Force Charge: No</li><li>Shut Inverter: No')
        .replace('PYGBC','Preserve: Yes, grid < battery cost')
        .replace('P:Y','Preserve: Yes')
        .replace('P:N','Preserve: No')
        .replace('NPFCNDU','-ve price: force charge (non-demand user)')
        .replace('CSC:','Charge skipped: cheapest')
        .replace('NSCSO:','No scheduled charge — solar ok')
        .replace('EPA:','Exclusion period active, overriding other decisions.')
        .replace('PCS:C','Planned charge skipped: cheapest')
        .replace('DMI:','Demand in:')
        .replace('DEMI:','Demand imminent - stopping any imports')
        .replace('WR:','Weather: Restrict')
        .replace('WN:','Weather: Normal')
        .replace('MMT:','mm tomorrow, restrict')
        .replace('ENOW:','Export now:')
        .replace('Plan: NSCR','Plan: No scheduled charge required')
        .replace('CRFEH','Charge reduced: Forecasted export headroom')
        .replace('DRUNAV:','Dynamic reserve unavailable:')
        .replace('DRSV','Dynamic reserve:')
        .replace('CREEEI','cap reached; exporting eligible excess in')
        .replace('STRSV','Stop reserve')
        .replace('Imp remain:','Import cap remaining:')
        .replace('Exp remain:','Export cap remaining:')
        .replace('Exp now:', 'Export Now:')
        .replace('EUTO','exporting up to')
        .replace('KWHEI','kWh excess in')
        .replace('KWHFHT','kWh for a higher tariff. Stop reserve')
        .replace('EXIN','exporting in')
        .replace('SOTPKC','SOC or the provider kWh cap.')
        .replace('DRRH','Dynamic reserve reached: holding')
        .replace('SFFSOL','SOC for forecast use until solar recovery.')
        .replace('DR:H','Dynamic reserve: holding')
        .replace('KFAHPEP','kWh for a higher-priced export period. Target reserve')
        .replace('DRWFEB','Dynamic reserve: waiting for an enabled battery-export period. Target reserve')
        .replace('DYNRES','Dynamic reserve:')
        .replace('PKCR','provider kWh cap reached; battery export stopped.')
        .replace('DRNBER','Dynamic reserve: no battery export required now. Target reserve')
      %}
      <ul style="padding-left: 20px; font-size: 1.1em; line-height: 1.6;">
        {{ translated_content }}
      </ul>
      {% set epoch = states('sensor.energy_manager_decision_timestamp') | int(0) %}
      **Last Updated:** {{ epoch | timestamp_custom('%d %b %Y at %I:%M %p', true) }}
    {% endif %}
  view_layout:
    em_id: decision
    em_width: 12
    em_name: Energy Manager Decision
    em_column: 0
    em_order: 6
    em_required: true
