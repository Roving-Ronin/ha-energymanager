- type: markdown
  entity_id:
  - sensor.energy_manager_plan
  content: >
    {% set plan = state_attr('sensor.energy_manager_plan',
    'energy_plan') %}

    {% if plan is string %}
      {% set plan = plan | from_json(default={}) %}
    {% endif %}

    {% set plan = plan if plan is mapping else {} %}

    {% set timeline = plan.get('timeline', []) %}


    ### 🔮 Future Decisions


    {% if timeline %}

    {% set ns = namespace(rows=[
      '| Time | Decision | Buy | Sell | Load | Solar | Grid | EV | Batt |',
      '|:---|:---|---:|---:|---:|---:|---:|---:|---:|'
    ]) %}


    {% for r in timeline[:10] %}
      {% set pv = r.inputs.pv_kw | float(0) %}
      {% set load = r.inputs.load_kw | float(0) %}
      {% set ev = r.inputs.ev_charge_kw | float(0) %}
      {% set charge = r.expected.battery_charge_kw | float(0) %}
      {% set discharge = r.expected.battery_discharge_kw | float(0) %}
      {% set imp = r.expected.grid_import_kw | float(0) %}
      {% set exp = r.expected.grid_export_kw | float(0) %}
      {% set battery = charge - discharge %}
      {% set grid = imp - exp %}

      {% if exp > 0.05 %}
        {% set action = '⚡ Export → Grid' %}
      {% elif imp > 0.05 and charge > 0.05 %}
        {% set action = '⚡ Grid → Battery' %}
      {% elif pv > 0.05 and charge > 0.05 %}
        {% set action = '☀️ Solar → Battery' %}
      {% elif pv > 0.05 %}
        {% set action = '☀️ Solar → Home' %}
      {% elif discharge > 0.05 %}
        {% set action = '🔋 Battery → Home' %}
      {% elif imp > 0.05 %}
        {% set action = '⚡ Grid → Home' %}
      {% else %}
        {% set action = '⏸️ Standby' %}
      {% endif %}

      {% if ev > 0.05 %}
        {% set action = action ~ ' + 🚗 EV' %}
      {% endif %}

      {% set row = '| ' ~
        (as_timestamp(r.ts) | timestamp_custom('%H:%M', true)) ~ ' | ' ~
        action ~ ' | ' ~
        ('%.3f' | format(r.inputs.buy_price | float(0))) ~ ' | ' ~
        ('%.3f' | format(r.inputs.sell_price | float(0))) ~ ' | ' ~
        ('%.2f' | format(load)) ~ ' | ' ~
        ('%.2f' | format(pv)) ~ ' | ' ~
        ('%+.2f' | format(grid)) ~ ' | ' ~
        ('%.2f' | format(ev)) ~ ' | ' ~
        ('%+.2f' | format(battery)) ~ ' |'
      %}
      {% set ns.rows = ns.rows + [row] %}
    {% endfor %}


    {{ ns.rows | join('\n') }}


    {% else %}

    No forecast available.

    {% endif %}
  view_layout:
    em_id: future-decisions
    em_width: 12
    em_name: Future Decisions
    em_column: 0
    em_order: 14
