# Energy Manager PV Dashboard — v2.0.1
views:
  - type: custom:energy-manager-layout
    icon: mdi:home-lightning-bolt
    path: em-overview
    title: Overview
    layout_columns: 3
    cards: !include energy_manager_cards.yaml
  - title: Pricing
    path: em-pricing
    icon: mdi:battery-outline
    type: panel
    cards:
      - type: custom:state-switch
        entity: input_select.electricity_provider
        states:
          "LocalVolts":
            type: custom:energy-manager-wholesale-pricing-card
          "Amber Electric":
            type: custom:energy-manager-wholesale-pricing-card
          "Flow Power":
            type: custom:energy-manager-flow-power-pricing-card
          "Globird":
            type: custom:energy-manager-globird-pricing-card
          "Other":
            type: vertical-stack
            cards:
              - type: markdown
                content: >-
                  # Custom Electricity Plans

                  All configurations are performed on the [Settings tab](/energy-pv/em-settings).


                  This current page is only used by Amber Electric, LocalVolts, Globird and Flow Power providers.
  - type: sections
    title: Settings
    path: em-settings
    icon: mdi:cog-outline
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            cards:
              - type: markdown
                content: >-
                  # Your Energy Setup

                  Enter the details of your solar and battery setup.


                  **Battery Install Date:** Used to calculate battery
                  cycles/day.

                  **Inverter Size:** This should be the advertised inverter
                  size, in kW.

                  **Battery Charge and Discharge Power Limit:** Check your manual
                  or with your installer to find out what the maximum charge and
                  discarge limits are for your batteries.
                  _Important: Do NOT enter a discharge limit that is higher
                  than your inverter rating.__

                  **Invert Export Limit:** This will generally be what your
                  energy company (e.g. Energex) allow you to export. Normally it
                  would be 5kW, even if you have a larger inverter.

                  **Battery Capacity:** Enter the size of your battery stack, in
                  kWh.

                  **Total Solar Array Size:** Enter the total size of your solar
                  panel array(s), in kW

                  **Energy Manager API Key:** Obtain your free API Key from
                  https://energymanager.com.au

                  **Exclusion Period:** You are able to set a time period when
                  you will disable battery discharge, so that you will *only*
                  take from the grid - good for EV charging. Leave disabled
                  unless you really need it. [PREMIUM ONLY]
                text_only: true
              - type: entities
                title: System Configuration
                entities:
                  - entity: input_select.inverter_brand
                    name: Inverter Brand
                  - entity: sensor.configuration_status
                    name: Status
                  - entity: input_boolean.restart_required
              - type: conditional
                conditions:
                  - entity: input_select.inverter_brand
                    state: "goodwe"
                card:
                  type: entities
                  entities:
                    - entity: input_number.goodwe_schedule_8slot
                      name: GoodWe EH Slot (1-8)
              - type: conditional
                conditions:
                  - entity: input_select.inverter_brand
                    state: "goodwe_et"
                card:
                  type: entities
                  entities:
                    - entity: input_number.goodwe_schedule_4slot
                      name: GoodWe ET/ESA Slot (1-4)
              - type: entities
                entities:
                  - entity: input_datetime.battery_install_date
                  - entity: input_number.battery_install_cost
                  - entity: input_boolean.battery_2_enabled
                    name: Enable Battery 2 for Costings
                  - type: conditional
                    conditions:
                      - entity: input_boolean.battery_2_enabled
                        state: "on"
                    row:
                      entity: input_datetime.battery_install_date_2
                  - type: conditional
                    conditions:
                      - entity: input_boolean.battery_2_enabled
                        state: "on"
                    row:
                      entity: input_number.battery_install_cost_2
                  - entity: input_number.inverter_import_limit
                    name: Inverter Size (kW)
                  - entity: input_number.battery_charge_power_hardlimit
                    name: Battery Charge Limit (W)
                    icon: mdi:battery-arrow-up
                  - entity: input_number.battery_discharge_power_hardlimit
                    name: Battery Discharge Limit (W)
                    title: "Important: This must NOT be higher than the inverter rating, even if the battery can discharge at a higher rate. Your inverter may behave erratically if this is configured incorrectly."
                    icon: mdi:battery-arrow-down
                  - entity: input_number.safety_max_charge_power
                    name: Safety - Max Charge
                    mode: box
                  - entity: input_number.safety_max_discharge_power
                    name: Safety - Max Discharge
                    mode: box
                  - entity: input_number.inverter_export_power_hardlimit
                    name: Export Power Limit (W)
                  - entity: input_number.battery_capacity
                    name: Battery Capacity (kWh)
                  - entity: input_number.solar_array_size
                    name: Total Solar Array Size (kW)
                  - entity: input_boolean.enable_curtailing
                    name: Enable Curtailing
                  - entity: input_boolean.dynamic_charging
                  - entity: input_number.inverter_max_charge_limiter_percentage
                    name: Allow charge rate %
                    mode: box
                  - entity: input_number.inverter_max_discharge_limiter_percentage
                    name: Allow discharge rate %
                    mode: box
                  - entity: input_text.energymanager_key
                    name: Energy Manager API Key (Required)
                  - entity: input_text.em_api_version
                    name: Energy Manager API Version
                  - entity: input_text.timezone
                    name: Timezone (e.g., AEST or AEDT) (Required)
                  - entity: input_select.em_update_branch
                  - entity: input_boolean.enable_exclusion_period
              - type: conditional
                conditions:
                  - entity: input_boolean.enable_exclusion_period
                    state: "on"
                card:
                  type: entities
                  entities:
                    - entity: input_datetime.exclusion_start_time
                    - entity: input_datetime.exclusion_end_time

              - type: entities
                title: Dynamic Battery Reserve
                entities:
                  - entity: input_boolean.dynamic_reserve
                  - type: conditional
                    conditions:
                      - entity: input_boolean.dynamic_reserve
                        state: "on"
                    row:
                      entity: input_select.dynamic_reserve_strategy
                      name: Strategy

              - type: markdown
                content: >
                  **Dynamic Reserve** will calculate the best battery reserve for your selling strategy based on your predicted house power load between "now" and when your PV Generation exceeds your house load in the morning. Note that you should start **Conservatively** until you understand how it works.


                  **Amber & LocalVolts**: Dynamic reserve is not available on the **Normal Mode** selling strategy. However, if enabled, on other modes it will aim to have your battery near your minimum SOC each morning by exporting any excess.


                  **Flow Power**: Dynamic reserve will override your **Peak reserve** settings and will work out its own reserve each night.


                  **Glowbird**: Dynamic reserve will override both your **Peak export reserve** and your **Other export reserve** settings and will work out its own reserve each night.


                  **Other**: Dynamic reserve will override your **Peak export reserve** settings and will work out its own reserve each night.  Ensure that you allow export from the battery during the periods that you want included in the dynamic reserve.
                card_mod:
                  style: |
                    ha-card {
                      border-top: none;
                      margin-top: -20px;
                      margin-bottom: 20px;
                    }
              - type: conditional
                conditions:
                  - entity: input_select.electricity_provider
                    state: ["LocalVolts", "Amber Electric"]
                card:
                  type: sensor
                  entity: sensor.nodered_energyproviderupdate
                  graph: none
                  detail: 1
                  name: Electricity Provider API Last Successful Poll
              - graph: none
                type: sensor
                entity: sensor.solcast_last_updated
                detail: 1
                name: Solcast API Last Successful Poll
              - graph: none
                type: sensor
                entity: sensor.em_last_updated
                detail: 1
                name: Energy Manager API Last Successful Poll
                icon: mdi:clock
              - graph: none
