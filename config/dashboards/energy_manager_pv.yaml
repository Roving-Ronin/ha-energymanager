    sections:
      - type: grid
        cards:
          - type: markdown
            content: >-
              # Energy Manager Updates
          - type: entities
            entities:
              - entity: sensor.energy_manager_update_status
                name: Update Status
              - entity: sensor.energy_manager_current_version
                name: Current Version
              - entity: sensor.energy_manager_available_version_display
                name: Available Version
              - entity: input_datetime.energy_manager_last_update_check
                name: Last Check
              - entity: input_boolean.energy_manager_auto_update_check
                name: Auto-Check Updates
          - type: conditional
            conditions:
              - entity: binary_sensor.ssh_key_exists
                state: "off"
            card:
              type: button
              tap_action:
                action: call-service
                service: automation.trigger
                target:
                  entity_id: automation.generate_ssh_key_shell
              name: Generate SSH Key
              icon: mdi:key-plus
              show_name: true
              show_icon: true
          - type: conditional
            conditions:
              - entity: input_text.ssh_key_status
                state: "success"
              - entity: input_text.ssh_key_dismissed
                state_not: "true"
            card:
              type: vertical-stack
              cards:
                - type: markdown
                  content: |
                    ## 🔑 SSH Key Generated!

                    **Add to SSH Addon:**


                    1. Go to Settings → Apps → Advanced SSH & Web Terminal

                    2. Click Configuration tab

                    3. Click on the 3-dots to the right of 'Options' and select 'Edit in YAML'

                    4. Replace 'authorized keys: []' with the following:

                    ```yaml
                    authorized_keys:
                      - "{{ states('input_text.ssh_public_key') }}"
                    ```
                    Then:

                    5. Save and restart SSH addon

                    6. Done! Energy Manager updates will now work once you have configured your free API key.
                - type: button
                  tap_action:
                    action: call-service
                    service: input_text.set_value
                    target:
                      entity_id: input_text.ssh_key_dismissed
                    service_data:
                      value: "true"
                  name: "✓ Done - Hide This Message"
                  icon: mdi:check
          - show_name: true
            show_icon: true
            type: button
            entity: script.check_for_energy_manager_updates
            name: Check Updates
            icon: mdi:update
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.check_for_energy_manager_updates
          - show_name: true
            show_icon: true
            type: button
            entity: script.update_energy_manager
            name: Install Update
            icon: mdi:download
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.update_energy_manager
          - show_name: true
            show_icon: true
            type: button
            entity: script.update_energy_manager_force
            name: Force Reinstall
            icon: mdi:download-multiple
            tap_action:
              action: call-service
              service: script.turn_on
              service_data:
                entity_id: script.update_energy_manager_force
          - type: entities
            title: Energy Manager Update Result
            entities:
              - entity: sensor.energy_manager_update_result
                name: Last Update Result
              - type: attribute
                entity: sensor.energy_manager_update_result
                attribute: detail
                name: Update Details
          - type: conditional
            conditions:
              - entity: input_boolean.energy_manager_update_available
                state: "on"
            card:
              type: markdown
              content: >
                ## 🆕 Update Available!

                **New Version:** {{ states('input_text.energy_manager_available_version') }}

                **Current Version:** {{ states('sensor.energy_manager_current_version') }}

                **Last Checked:** {{ states('input_datetime.energy_manager_last_update_check') }}

                ### 📋 Updates:

                {{ states('input_text.energy_manager_changelog') }}
                ---
                Click "Install Update" above to upgrade.
          - type: markdown
            content: >-
              **Important:** All Energy Manager updates and force reinstalls
              require a mandatory Home Assistant OS reboot. The reboot
              happens automatically, without further confirmation.

              After starting an update, allow several minutes for installation,
              the reboot and post-update checks. Do not restart Home Assistant,
              interrupt the process or start another update.

              Energy Manager will display a completion notification only
              after Home Assistant has rebooted and the post-update checks
              have completed successfully.

              **Check Updates does not cause a reboot.**               
